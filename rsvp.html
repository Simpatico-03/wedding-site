<main class="container rsvp-page">
    <p class="verse reveal" style="--i: 0;">20 August 2026</p>
    <h1 class="names reveal" style="--i: 1;">RSVP</h1>
    <p class="invite-text reveal" style="--i: 2;">We would love to know if you can celebrate with us.</p>

    <img src="assets/GoldDivider.png" alt="" class="gold-divider-img" aria-hidden="true" style="margin: 20px auto;">

    <section id="rsvp-form" class="rsvp-form reveal" style="--i: 3;">
        <h2 class="section-title reveal" style="--i: 0;">RSVP Form</h2>
        <form data-rsvp-form>
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" autocomplete="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" autocomplete="tel">
            </div>
            <div class="form-group">
                <label for="attendance">Will You Attend?</label>
                <select id="attendance" name="attendance" required>
                    <option value="">Select...</option>
                    <option value="Yes, I will attend">Yes, I will attend</option>
                    <option value="No, I cannot attend">No, I cannot attend</option>
                </select>
            </div>
            <div class="form-group">
                <label for="guests">Number of Guests</label>
                <select id="guests" name="guests" required>
                    <option value="">Select...</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5+">5+</option>
                </select>
            </div>
            <div class="form-group">
                <label for="dietary">Dietary Restrictions</label>
                <input type="text" id="dietary" name="dietary" placeholder="e.g., Vegetarian, Vegan">
            </div>
            <div class="form-group">
                <label for="message">Message for the Couple</label>
                <textarea id="message" name="message" rows="3" placeholder="Share a message with Richa & Karun..."></textarea>
            </div>
            <button type="submit" class="submit-btn">Submit RSVP</button>
            <p class="form-status" data-form-status role="status" aria-live="polite"></p>
        </form>
    </section>
</main>

<script src="scripts.js"></script>
<script>
const audio = document.getElementById('bg-music');
const btn = document.getElementById('music-toggle');
const musicIcon = btn.querySelector('i');

function setIcon(playing) {
  musicIcon.className = playing ? 'ti ti-music-off' : 'ti ti-music';
  btn.setAttribute('aria-label', playing ? 'Pause music' : 'Play music');
  btn.classList.toggle('spinning', playing);
}

function tryPlay() {
  audio.play().then(() => {
    sessionStorage.setItem('musicPlaying', 'true');
    setIcon(true);
  }).catch(() => {});
}

const savedTime = sessionStorage.getItem('musicTime');
const wasPlaying = sessionStorage.getItem('musicPlaying') === 'true';

if (savedTime) audio.currentTime = parseFloat(savedTime);

if (wasPlaying) {
  tryPlay();
  const onInteraction = () => {
    tryPlay();
    ['click','scroll','touchstart'].forEach(e => document.removeEventListener(e, onInteraction));
  };
  ['click','scroll','touchstart'].forEach(e => document.addEventListener(e, onInteraction, { once: true }));
} else if (!sessionStorage.getItem('musicPlaying')) {
  const onFirst = () => {
    tryPlay();
    ['click','scroll','touchstart'].forEach(e => document.removeEventListener(e, onFirst));
  };
  ['click','scroll','touchstart'].forEach(e => document.addEventListener(e, onFirst, { once: true }));
}

btn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (audio.paused) {
    tryPlay();
  } else {
    audio.pause();
    sessionStorage.setItem('musicPlaying', 'false');
    setIcon(false);
  }
});

window.addEventListener('beforeunload', () => {
  sessionStorage.setItem('musicTime', audio.currentTime);
  sessionStorage.setItem('musicPlaying', (!audio.paused).toString());
});
</script>
</body>
